[tox]
requires =
    tox-uv
    tox-gh-actions
envlist = py311, py312, py313, py314, mypy, ruff
isolated_build = false

[gh-actions]
python =
    3.11: py311, mypy, ruff
    3.12: py312
    3.13: py313
    3.14: py314

[testenv]
setenv =
    PYTHONPATH = {toxinidir}
passenv =
    EXPECTED_PYTHON_VERSION
    SKIP_LIVE_SUBMISSION_TESTS
dependency_groups =
    dev
commands =
    pytest --numprocesses auto --basetemp={envtmpdir} --cov --cov-append --cov-report=term-missing -vv -rA

[testenv:mypy]
dependency_groups =
    dev
commands = mypy --install-types --non-interactive src

[testenv:ruff]
dependency_groups =
    dev
commands = ruff check src test

[testenv:report]
dependency_groups =
    dev
skip_install = true
commands =
    coverage report
    coverage html

[testenv:clean]
dependency_groups =
    dev
skip_install = true
commands = coverage erase
